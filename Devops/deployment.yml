kind: Deployment 
apiVersion: apps/v1

metadata:
  name: nginx-deployment
  namespace: nginx
  labels: 
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /var/www/html
          name: my-vol
      volumes:
        - name: my-vol
          persistentVolumeClaim:
            claimName: local-pvc
