kind: Deployment 
apiVersion: apps/v1

metadata:
  name: landing-page
  namespace: nginx
  labels: 
    app: landing-page
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
      - name: home-page
        image: sufiyan0/landing-page:latest
        ports:
        - containerPort: 3000
